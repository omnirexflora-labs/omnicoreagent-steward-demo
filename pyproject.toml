[project]
name = "versionkit"
version = "0.1.0"
description = "Parse and compare release versions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/versionkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
